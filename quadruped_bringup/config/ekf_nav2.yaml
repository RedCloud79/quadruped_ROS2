ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Fast-LIO odometry (odom -> base_link)
    odom0: /Odometry
    odom0_config: [true, true, true,
                   false, false, true,
                   true, true, true,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: true

    # Autoware localization (map -> base_link pose)
    pose0: /localization/pose_twist_fusion_filter/pose
    pose0_config: [true, true, true,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false

    publish_tf: true
